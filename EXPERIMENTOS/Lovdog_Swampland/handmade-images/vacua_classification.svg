<!-- SVG file hend written -->
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">

<svg
  width="600"
  height="600"
  version="1.1"
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink" 
>

<defs>
  <!--
  Gradient for the cartesian, red to blue
  Conical gradient, starts at x="50%", y="0" with 360° angle
  and transparency of 0.8
  -->
  <linearGradient id="grad1" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"   style="stop-color:#CCCCff;stop-opacity:0.4" />
    <stop offset="100%" style="stop-color:#ffCCCC;stop-opacity:0.4" />
  </linearGradient>
  <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
    <stop offset="0%"   style="stop-color:#CCff00;stop-opacity:0.2" />
    <stop offset="100%" style="stop-color:#ffCCff;stop-opacity:0.2" />
  </linearGradient>
</defs>
<style>
  text {
  font-family: "QTBookmann";
  }
</style>

<!--Cartesian plane-->

<rect id="back1" x="0" y="0" width="600" height="600" fill="none" stroke="black" stroke-width="2" fill="url(#grad1)" />
<rect id="back2" x="0" y="0" width="600" height="600" fill="none" stroke="black" stroke-width="2" fill="url(#grad2)" />

<g id="cart_arrows">
  <line x1="0" y1="50%" x2="100%" y2="50%" stroke="#ff3355" stroke-width="2" />
  <text x="100%" y="50%" dy="-0.5em" dx="-4em" font-size="14" fill="black">
    Min(&#120524;)
  </text>

  <line x1="50%" y1="0" x2="50%" y2="100%" stroke="#ff00ff" stroke-width="2" />
  <line x1="0" y1="300" x2="600" y2="300" stroke="#ff3355" stroke-width="2" />
  <text x="100%" y="50%" dy="-0.5em" dx="-4em" font-size="14" fill="black">
    Min(&#120524;)
  </text>
</g>

<!--Vacua Names-->
<!-- Second quadrant Stable dS-->
<text  x="75%" y="25%" font-size="20" fill="black" dominant-baseline="middle" text-anchor="middle">
<tspan x="75%" y="25%" dy="-1em">Stable</tspan>
<tspan x="75%" y="25%" dy=" 1em">dS</tspan>
</text>

<!-- Fourth quadrant Stable AdS-->
<text  x="75%" y="75%" font-size="20" fill="black" dominant-baseline="middle" text-anchor="middle">
<tspan x="75%" y="75%" dy="-1em">Stable</tspan>
<tspan x="75%" y="75%" dy=" 1em">AdS</tspan>
</text>

<!-- Third quadrant Tachionic dS-->
<text  x="25%" y="25%" font-size="20" fill="black" dominant-baseline="middle" text-anchor="middle">
<tspan x="25%" y="25%" dy="-1em">Tachionic</tspan>
<tspan x="25%" y="25%" dy=" 1em">dS</tspan>
</text>

<!-- Fourth quadrant Tachionic AdS-->
<text  x="25%" y="75%" font-size="20" fill="black" dominant-baseline="middle" text-anchor="middle">
<tspan x="25%" y="75%" dy="-1em">Tachionic</tspan>
<tspan x="25%" y="75%" dy=" 1em">AdS</tspan>
</text>

</svg>
