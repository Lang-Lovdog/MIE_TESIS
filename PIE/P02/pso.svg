<svg viewBox="0 0 700 320" width="100%" height="100%"
xmlns="http://www.w3.org/2000/svg" style="background-color: #f4ebd0; border: 1px solid #5a3d28; border-radius: 4px;">
  <style>
    .grid-line { stroke: #d3c29b; stroke-width: 0.8; stroke-dasharray: 3,3; }
    .axis { stroke: #5a3d28; stroke-width: 1.5; }
    .terrain-fill { fill: rgba(140, 109, 83, 0.15); }
    .terrain-path { fill: none; stroke: #5a3d28; stroke-width: 2.2; }
    .axis-label { font-family: 'IM Fell DW Pica', serif; fill: #5a3d28; font-size: 12px; }
    .particle { fill: #5a3d28; }
    .p-text { font-family: 'IM Fell DW Pica', serif; fill: #5a3d28; font-size: 11px; font-weight: bold; }
  </style>

  <!-- Ejes -->
  <line x1="40" y1="260" x2="660" y2="260" class="axis" />
  <line x1="40" y1="40" x2="40" y2="260" class="axis" />
  <text x="635" y="280" class="axis-label">Espacio (x)</text>
  <text x="15" y="50" class="axis-label">V(x)</text>

  <line x1="40" y1="100" x2="660" y2="100" class="grid-line" />
  <line x1="40" y1="180" x2="660" y2="180" class="grid-line" />

  <defs>
    <!-- Terreno completo (mínimo global en 450,242) -->
    <path id="terrain-curve" d="M 50 155
      C 80 90 110 78 145 105
      C 185 135 215 185 250 212
      C 285 238 310 200 340 172
      C 375 140 400 242 450 242
      C 500 242 520 200 555 150
      C 590 115 615 108 650 130" />

    <!-- Sub-rutas reales del terreno, TODAS terminan en (450,242) -->
    <path id="route-1" d="M 50 155
      C 80 90 110 78 145 105
      C 185 135 215 185 250 212
      C 285 238 310 200 340 172
      C 375 140 400 242 450 242" />

    <path id="route-2" d="M 250 212
      C 285 238 310 200 340 172
      C 375 140 400 242 450 242" />

    <path id="route-3" d="M 650 130
      C 615 108 590 115 555 150
      C 520 200 500 242 450 242" />
  </defs>

  <!-- Relleno bajo el terreno -->
  <path d="M 50 155
      C 80 90 110 78 145 105
      C 185 135 215 185 250 212
      C 285 238 310 200 340 172
      C 375 140 400 242 450 242
      C 500 242 520 200 555 150
      C 590 115 615 108 650 130
      L 650 260 L 50 260 Z" class="terrain-fill" />

  <!-- Curva del terreno -->
  <use href="#terrain-curve" class="terrain-path" />

  <!-- x₁ — paso fino: avanza, retrocede poquito, converge lento -->
  <g>
    <circle cx="0" cy="0" r="4.5" class="particle" />
    <text x="7" y="-7" class="p-text">x₁</text>
    <animateMotion dur="11s" begin="0s" repeatCount="indefinite"
      calcMode="linear"
      keyPoints="0; 0.18; 0.14; 0.35; 0.31; 0.53; 0.50; 0.68; 0.66; 0.82; 0.80; 0.92; 0.91; 0.97; 1; 1"
      keyTimes=" 0; 0.08; 0.13; 0.22; 0.27; 0.36; 0.41; 0.50; 0.55; 0.64; 0.69; 0.77; 0.82; 0.88; 0.94; 1">
      <mpath href="#route-1" />
    </animateMotion>
  </g>

  <!-- x₂ — paso medio: sale del mínimo local y converge -->
  <g>
    <circle cx="0" cy="0" r="4.5" class="particle" />
    <text x="7" y="14" class="p-text">x₂</text>
    <animateMotion dur="11s" begin="0s" repeatCount="indefinite"
      calcMode="linear"
      keyPoints="0; 0.25; 0.18; 0.50; 0.44; 0.72; 0.68; 0.88; 0.86; 0.96; 1; 1"
      keyTimes=" 0; 0.10; 0.17; 0.30; 0.37; 0.50; 0.57; 0.70; 0.76; 0.86; 0.93; 1">
      <mpath href="#route-2" />
    </animateMotion>
  </g>

  <!-- x₃ — paso grande: overshoot amplio cruzando el mínimo -->
  <g>
    <circle cx="0" cy="0" r="4.5" class="particle" />
    <text x="-16" y="-7" class="p-text">x₃</text>
    <animateMotion dur="11s" begin="0s" repeatCount="indefinite"
      calcMode="linear"
      keyPoints="0; 0.35; 0.22; 0.68; 0.58; 0.88; 0.84; 0.97; 1; 1"
      keyTimes=" 0; 0.13; 0.22; 0.38; 0.47; 0.63; 0.70; 0.85; 0.93; 1">
      <mpath href="#route-3" />
    </animateMotion>
  </g>
</svg>
