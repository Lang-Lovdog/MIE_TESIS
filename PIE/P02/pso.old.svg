<svg viewBox="0 0 700 320" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="background-color: #f4ebd0; border: 1px solid #5a3d28; border-radius: 4px;">
  <style>
    .grid-line { stroke: #d3c29b; stroke-width: 0.8; stroke-dasharray: 3,3; }
    .axis { stroke: #5a3d28; stroke-width: 1.5; }
    .terrain-fill { fill: rgba(140, 109, 83, 0.15); }
    .terrain-path { fill: none; stroke: #5a3d28; stroke-width: 2.2; }
    .label { font-family: 'IM Fell DW Pica', serif; fill: #5a3d28; font-size: 13px; font-style: italic; }
    .axis-label { font-family: 'IM Fell DW Pica', serif; fill: #5a3d28; font-size: 12px; }
    .particle { fill: #5a3d28; }
    .p-text { font-family: 'IM Fell DW Pica', serif; fill: #5a3d28; font-size: 11px; font-weight: bold; }
    .global-opt { stroke: #b22222; stroke-width: 1.5; stroke-dasharray: 2,2; }
  </style>

  <!-- Ejes coordenados -->
  <line x1="40" y1="260" x2="660" y2="260" class="axis" />
  <line x1="40" y1="40" x2="40" y2="260" class="axis" />
  <text x="635" y="280" class="axis-label">Espacio (x)</text>
  <text x="15" y="50" class="axis-label">V(x)</text>

  <!-- Líneas guía de energía -->
  <line x1="40" y1="100" x2="660" y2="100" class="grid-line" />
  <line x1="40" y1="180" x2="660" y2="180" class="grid-line" />

  <defs>
    <!-- Terreno completo: mínimo global garantizado en (450, 242) -->
    <path id="terrain-curve" d="M 50 155
      C 80 90 110 78 145 105
      C 185 135 215 185 250 212
      C 285 238 310 200 340 172
      C 375 140 400 242 450 242
      C 500 242 520 200 555 150
      C 590 115 615 108 650 130" />

    <!-- Rutas de convergencia: TODAS terminan en el mínimo global (450,242) -->
    <path id="route-1" d="M 50 155
      C 80 90 110 78 145 105
      C 185 135 215 185 250 212
      C 285 238 310 200 340 172
      C 375 140 400 242 450 242" />

    <path id="route-2" d="M 250 212
      C 285 238 310 200 340 172
      C 375 140 400 242 450 242" />

    <!-- Terreno recorrido en sentido inverso (desde la derecha hacia el valle) -->
    <path id="route-3" d="M 650 130
      C 615 108 590 115 555 150
      C 520 200 500 242 450 242" />
  </defs>

  <!-- Relleno inferior del terreno -->
  <path d="M 50 155
      C 80 90 110 78 145 105
      C 185 135 215 185 250 212
      C 285 238 310 200 340 172
      C 375 140 400 242 450 242
      C 500 242 520 200 555 150
      C 590 115 615 108 650 130
      L 650 260 L 50 260 Z" class="terrain-fill" />

  <!-- Línea visible del terreno -->
  <use href="#terrain-curve" class="terrain-path" />

  <!-- Mínimo Global -->
  <line x1="450" y1="100" x2="450" y2="260" class="global-opt" />
  <circle cx="450" cy="242" r="3" fill="#b22222" />
  <text x="375" y="90" class="label">Vacío Estable (Mín. Global)</text>

  <!-- Partícula 1: explora desde la izquierda, cruza el mínimo local y converge -->
  <g>
    <circle cx="0" cy="0" r="4.5" class="particle" />
    <text x="7" y="-7" class="p-text">x₁</text>
    <animateMotion dur="9s" begin="0s" repeatCount="indefinite"
                   calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.72;1">
      <mpath href="#route-1" />
    </animateMotion>
  </g>

  <!-- Partícula 2: parte del valle local y converge al mínimo global -->
  <g>
    <circle cx="0" cy="0" r="4.5" class="particle" />
    <text x="7" y="14" class="p-text">x₂</text>
    <animateMotion dur="7s" begin="-2s" repeatCount="indefinite"
                   calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.72;1">
      <mpath href="#route-2" />
    </animateMotion>
  </g>

  <!-- Partícula 3: desciende desde la derecha hasta el mismo mínimo -->
  <g>
    <circle cx="0" cy="0" r="4.5" class="particle" />
    <text x="-16" y="-7" class="p-text">x₃</text>
    <animateMotion dur="8s" begin="-4s" repeatCount="indefinite"
                   calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.72;1">
      <mpath href="#route-3" />
    </animateMotion>
  </g>
</svg>
